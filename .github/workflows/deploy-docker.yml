name: Build and Push Crove Cal Docker Image

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Why: this workflow publishes :latest on every push. Without a gate the image
  # ships untested code straight to the registry (audit finding HI-09).
  ci-gate:
    name: CI gate (type check)
    uses: ./.github/workflows/check-types.yml
    secrets: inherit

  build-and-push:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner for image name
        id: image-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.image_name }}:latest
            ${{ steps.image-name.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          # Why: mode=max exports every build stage — including the builder stage
          # whose ENV carries DATABASE_URL and NEXTAUTH_SECRET defaults — into the
          # shared Actions cache. mode=min exports only the final image layers.
          cache-to: type=gha,mode=min
          build-args: |
            # Build-time only: next.config.ts asserts these during `next build`. The runner
            # stage does not carry them, so the real values must come from the runtime
            # environment - scripts/start.sh refuses to boot when they are missing.
            NEXTAUTH_SECRET=build-time-placeholder-not-used-at-runtime
            CALENDSO_ENCRYPTION_KEY=build-time-placeholder-not-used-at-runtime
            NEXT_PUBLIC_WEBAPP_URL=https://cal.crove.com
            # next.config.ts bakes this into a server-side rewrite at build time, so it must be
            # reachable from inside the web container. "localhost" resolved to the web container
            # itself, where nothing listens on 5555, leaving every /api/v2/* call dead. The API v2
            # service is published as "calcom-api" on the shared compose network (API_PORT default
            # 5555, see apps/api/v2/src/config/app.ts). Rebuild the image if the service is renamed.
            NEXT_PUBLIC_API_V2_URL=http://calcom-api:5555/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            NEXT_PUBLIC_APP_NAME=Crove
            NEXT_PUBLIC_COMPANY_NAME=MetaDOS LLC
            NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=help@crove.com
            NEXT_PUBLIC_ENABLE_PROFILE_SWITCHER=1
            NEXT_PUBLIC_DOS_ID_LOGIN_ENABLED=true
            OIDC_CLIENT_ID=18790ccb-4d71-48cd-ad24-aee5f3ced3da
            CALCOM_TELEMETRY_DISABLED=1
            CACHE_BUST=${{ github.sha }}
