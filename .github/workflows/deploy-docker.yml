name: Build and Push Crove Cal Docker Image

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner for image name
        id: image-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.image_name }}:latest
            ${{ steps.image-name.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://cal.crove.com
            NEXT_PUBLIC_API_V2_URL=http://localhost:5555/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            NEXT_PUBLIC_APP_NAME=Crove
            NEXT_PUBLIC_COMPANY_NAME=MetaDOS LLC
            NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=help@crove.com
            NEXT_PUBLIC_ENABLE_PROFILE_SWITCHER=1
            NEXT_PUBLIC_DOS_ID_LOGIN_ENABLED=true
            OIDC_CLIENT_ID=18790ccb-4d71-48cd-ad24-aee5f3ced3da
            CALCOM_TELEMETRY_DISABLED=1
